title: "CV Clanker"
description: "Self-hosted job search: scrape boards, score fit with an LLM, tailor your own LaTeX, Word or HTML CV per job, and track applications."
baseurl: /cvclanker
url: https://joaopn.github.io
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
color_scheme: rs
search_enabled: true
heading_anchors: true
mermaid:
  version: "11.4.1"
aux_links:
  "GitHub": ["https://github.com/joaopn/cvclanker"]
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/joaopn/cvclanker
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: edit
back_to_top: true
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
