<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV Clanker - Manage your job applications intelligently" />
    <title>CV Clanker</title>
    <script>
      /* Lockstep with src/lib/theme.ts: storage keys, theme ids and their
         order (index 0 is the default for each slot). theme.test.ts pins both
         sides. Both hooks are stamped on BOTH branches — .dark without
         data-theme would style dark variants over the light :root palette. */
      (function () {
        try {
          var stored = localStorage.getItem("cvclanker:theme");
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var ids = dark ? ["graphite-mono", "slate-blue", "forest-amber", "nord", "crimson-noir"] : ["sandstone", "ice", "newsprint", "vscode-light", "grape-light"];
          var picked = localStorage.getItem(dark ? "cvclanker:theme-dark" : "cvclanker:theme-light");
          if (ids.indexOf(picked) < 0) picked = ids[0];
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.setAttribute("data-theme", picked);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
