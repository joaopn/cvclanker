# =============================================================================
# CV Clanker - Docker Compose Configuration
# =============================================================================

services:
  cvclanker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvclanker:local
    container_name: cvclanker
    # Least-privilege hardening. The app runs an agentic `claude -p` subprocess
    # over internet-scraped text and drives content parsers (tectonic,
    # LibreOffice, Firefox) on untrusted documents — the one realistic
    # prompt-injection-to-host chain is a memory-safety bug in one of those
    # parsers. Dropping all Linux capabilities and blocking privilege
    # escalation contains that blast radius. Verified: the full workload
    # (server, tectonic compile, unoserver/LibreOffice convert, Firefox launch)
    # runs with no capabilities re-added — none of these binaries need one, and
    # the app binds 3001 (>1024, so no NET_BIND_SERVICE). Firefox/camoufox
    # sandbox via user namespaces + seccomp, which no-new-privileges does not
    # affect. Caveat: dropping ALL also removes root's DAC_OVERRIDE, so this
    # assumes ./data is writable by uid 0 (the default) — mount a data volume
    # owned by a non-root uid and you would need to re-add CAP_DAC_OVERRIDE.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3005:3001"
    volumes:
      # Persist database, generated PDFs, and the Codex login
      - ./data:/app/data
    environment:
      # Server config
      - NODE_ENV=production
      - PORT=3001
      # Host-facing port that the browser hits (matches the published mapping
      # above). Used only to print a correct URL in the startup banner.
      - HOST_PORT=3005

      # Python path (uses system python in container)
      - PYTHON_PATH=/usr/bin/python3
      # Claude Code provider auth. Bare name (no `=`) so the variable is passed
      # through only when it is actually set on the host or in ./.env — writing
      # `KEY=${KEY:-}` would define it as empty inside the container. Mint one
      # with `claude setup-token`; it can also be pasted into Settings instead.
      - CLAUDE_CODE_OAUTH_TOKEN
      # Baked prompt YAMLs — the SEED source for the DB prompts table (live
      # copies are edited in-app / via the API, not on disk)
      - PROMPTS_DIR=/app/prompts

    env_file:
      - path: ./.env
        required: false
    develop:
      watch:
        # Rebuild container when package.json changes
        - path: ./orchestrator/package.json
          action: rebuild
        - path: ./orchestrator/package-lock.json
          action: rebuild
        # Sync source code changes and rebuild inside container
        - path: ./orchestrator/src
          target: /app/orchestrator/src
          action: sync+restart
        # Sync extractor changes
        - path: ./extractors/hiringcafe/src
          target: /app/extractors/hiringcafe/src
          action: sync+restart
        - path: ./extractors/startupjobs/src
          target: /app/extractors/startupjobs/src
          action: sync+restart
        - path: ./extractors/workingnomads/src
          target: /app/extractors/workingnomads/src
          action: sync+restart
        - path: ./extractors/jobspy
          target: /app/extractors/jobspy
          action: sync+restart
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
