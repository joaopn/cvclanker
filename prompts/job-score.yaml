name: job-score
description: |
  Classifies how well a candidate fits a job into one of three categories:
  very_good_fit, good_fit, or bad_fit.
  Used by services/scorer.ts when ranking discovered jobs.
variables:
  - name: briefText
    description: Free-form personal brief describing the candidate's experience.
  - name: jobTitle
  - name: employer
  - name: location
  - name: salary
  - name: degreeRequired
  - name: disciplines
  - name: jobDescription
  - name: scoringInstructionsText
    description: User-supplied additional scoring guidance.
model:
  preferStructuredOutput: true
system: ""
user: |
  Classify how well this candidate fits the job. This is a shortlisting
  decision: would a reasonable recruiter who read the brief interview this
  candidate for this job? Treat the listed requirements as a wishlist, not
  a checklist — postings ask for more than any single hire has — and count
  adjacent, transferable experience as evidence. Pick exactly one of:
    - "very_good_fit": the candidate covers the core of the role (primary
      stack/domain, roughly the right level). Missing nice-to-haves or a
      couple of peripheral requirements does not disqualify. A recruiter
      would clearly shortlist.
    - "good_fit": real overlap with a real gap — the level is a stretch,
      the domain is adjacent rather than exact, or one core requirement is
      missing but learnable. A recruiter might shortlist.
    - "bad_fit": hard mismatches only — a different occupation, a level far
      off (e.g. junior brief vs. staff role), or a hard blocker such as a
      required language, clearance, or credential the brief shows no
      evidence of. "Covers only part of the wishlist" is not bad_fit by
      itself.
  When torn between two categories, pick the more generous one unless a
  hard blocker exists.

  Calibration examples:
  - Posting lists 8 requirements; the brief shows depth in the 4 core ones
    and none of the extras → very_good_fit.
  - Senior posting in the candidate's exact stack; the brief reads
    mid-level → good_fit.
  - Python backend role; the brief has strong Go/Java backend work but no
    Python → good_fit (transferable), not bad_fit.
  - Role requires fluent German; the brief shows none → bad_fit (hard
    blocker).

  Candidate brief:
  {{briefText}}

  Job:
  - Title: {{jobTitle}}
  - Employer: {{employer}}
  - Location: {{location}}
  - Salary: {{salary}}
  - Degree required: {{degreeRequired}}
  - Disciplines: {{disciplines}}

  Job description:
  {{jobDescription}}

  Additional scoring guidance: {{scoringInstructionsText}}

  Respond as JSON with
    { "category": "<very_good_fit | good_fit | bad_fit>",
      "reason": "<one to two sentence explanation>" }.
