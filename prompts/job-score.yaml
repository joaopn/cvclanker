name: job-score
description: |
  Classifies how well a candidate fits a job into one of four categories:
  great_fit, very_good_fit, good_fit, or bad_fit.
  Used by services/scorer.ts when ranking discovered jobs.
variables:
  - name: briefText
    description: Free-form personal brief describing the candidate's experience.
  - name: jobTitle
  - name: employer
  - name: location
  - name: salary
  - name: degreeRequired
  - name: disciplines
  - name: jobDescription
  - name: scoringInstructionsText
    description: The scoring policy — category semantics, gates, and calibration examples. The scoringInstructions setting (built-in default or user override).
model:
  preferStructuredOutput: true
system: ""
user: |
  Classify how well this candidate fits the job, into exactly one of the
  categories "great_fit", "very_good_fit", "good_fit", or "bad_fit",
  following the scoring policy below.

  Scoring policy:
  {{scoringInstructionsText}}

  Candidate brief:
  {{briefText}}

  Job:
  - Title: {{jobTitle}}
  - Employer: {{employer}}
  - Location: {{location}}
  - Salary: {{salary}}
  - Degree required: {{degreeRequired}}
  - Disciplines: {{disciplines}}

  Job description:
  {{jobDescription}}

  Respond as JSON with
    { "category": "<great_fit | very_good_fit | good_fit | bad_fit>",
      "reason": "<one to two sentence explanation>" }.
